spring:
  application:
    name: user-service   # Name of the microservice

  # OpenAI configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-nano
          temperature: 1.0

  # Database configuration (MySQL)
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/smarthire
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        generate_statistics: true

  # Kafka configuration (Producer)
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer



feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        retryer: feign.Retryer$NeverRetry   # 🔥 important

resilience4j:
  circuitbreaker:
    instances:
      job-service:
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
        sliding-window-size: 10
  ratelimiter:
    instances:
      job-service:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0

# Server configuration
server:
  port: 8081

# Eureka Client configuration
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
#      defaultZone: http://localhost:8761/eureka


management:
  tracing:
    sampling:
      probability: 1.0   # trace all requests (for dev)

  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans