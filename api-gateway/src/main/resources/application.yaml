server:
  port: 9090

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:

        # 🔹 Route 1 → User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v2/users/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeySolver}"


        # 🔹 Route 2 → Job Service
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/v2/jobs/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeySolver}"

management:
  tracing:
    sampling:
      probability: 1.0   # trace all requests (for dev)

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka